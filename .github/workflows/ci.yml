run-name:
    "${{ github.event_name == 'push' && format('CI · main · {0}', github.event.head_commit.message) || format('CI · PR #{0} · {1}',
    github.event.pull_request.number, github.event.pull_request.title) }}"

on:
    push:
        branches: [main]
        paths-ignore:
            - 'python/**'
            - '.github/workflows/python-ci.yml'
            - '.github/workflows/python-release.yml'
    pull_request:
        branches: [main]
        paths-ignore:
            - 'python/**'
            - '.github/workflows/python-ci.yml'
            - '.github/workflows/python-release.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm typecheck

    test-unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm test

    test-integration:
        name: Integration · ${{ matrix.runtime }}
        runs-on: ubuntu-latest
        needs: test-unit
        strategy:
            fail-fast: false
            matrix:
                runtime: [node, bun, deno]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              if: matrix.runtime == 'bun'
              with:
                  bun-version: latest
            # denoland/setup-deno publishes `v2` as a branch, not a tag, so the
            # previous ref moved with every push to it.
            - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
              if: matrix.runtime == 'deno'
              with:
                  deno-version: v2.x
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm --filter markdown-for-agents test:integration:${{ matrix.runtime }}
            - name: Middleware integration tests
              if: matrix.runtime == 'node'
              run: pnpm --filter './packages/middleware/*' run test:integration
            - name: Example integration tests
              if: matrix.runtime == 'node'
              run: pnpm --filter './examples/*' run test:integration
